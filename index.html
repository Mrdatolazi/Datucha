<title>დათუჩა</title>
<style>
:root{--bg:#f3efe6;--ink:#1d2a24;--btn:#e4ddcc;--btn2:#d3cab5;--line:#b9b09a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1c;--ink:#e8f1ec;--btn:#1d3036;--btn2:#2a444c;--line:#35525a}}
:root[data-theme="dark"]{--bg:#101a1c;--ink:#e8f1ec;--btn:#1d3036;--btn2:#2a444c;--line:#35525a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue","Noto Sans Georgian",sans-serif;touch-action:none;overscroll-behavior:none;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.g{width:100%;max-width:560px}
.wrap{position:relative}
canvas{display:block;width:100%;aspect-ratio:304/208;border:1px solid var(--line);border-radius:12px;image-rendering:pixelated}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:12px;background:rgba(20,30,40,.75);cursor:pointer;padding:0 24px;color:#fff}
#ov p{margin:0}
#t{font-size:24px;font-weight:600}
#m{font-size:14px;line-height:1.5;color:#e6edf2}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}
.row div{display:flex;gap:10px}
button{height:52px;border:0;border-radius:14px;background:var(--btn);color:var(--ink);font-size:20px;font-family:inherit;touch-action:none}
button:active{background:var(--btn2)}
.a{width:62px}.j{width:104px;font-size:16px}
.rot{display:none;font-size:12px;color:#bcd;margin-top:6px}
#lg{width:88px;height:88px}#lg svg{width:100%;height:100%;display:block}
#ov .s{font-size:13px;color:#ffd27a}
@media (orientation:landscape){
:root{padding:0}
body{padding:0;display:block}
.g{position:fixed;inset:0;max-width:none}
.wrap{position:absolute;inset:0}
canvas{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
#ov{border-radius:0}
#ov #lg{width:64px;height:64px}
.row{position:absolute;left:0;right:0;bottom:0;margin:0;padding:0 max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none}
button{pointer-events:auto;height:54px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.35)}
button:active{background:rgba(255,255,255,.3)}
.a{width:64px}.j{width:110px}
}
@media (orientation:portrait){.rot{display:block}}
</style>
</head>
